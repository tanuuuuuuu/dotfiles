# Herdr UI（herdr-gpui）の上書き設定。未記載のキーは config-gpui.toml（自動生成・編集禁止）のデフォルトを継承する。
# 全キーの例: https://github.com/penso/herdr-gpui/blob/main/config-gpui.example.toml

# agent を所属 workspace の直下にぶら下げ、Spaces をサイドバー全高にする
# （TUI の spaces / agents 2 分割が不便だったため）
agents_placement = "nested"
theme = "Iceberg Dark"

# 行の余白（論理ピクセル）。Settings > Sidebar のスライダーで変えると同じキーがここに保存される
[sidebar]
row_padding = 6   # 各行の上下余白（既定 2、上限 16）
gap = 12          # workspace 間の間隔（既定 6、上限 32）
